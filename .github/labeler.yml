# Автоматически ставятся только метки области: она следует из путей однозначно — тронули
# app/src/**/domain/** значит область домена.
#
# Правил "type: *" здесь нет намеренно, и добавлять их не нужно. Тип PR — суждение автора о
# характере изменения, и из diff он не выводится: правка PLAN.md бывает и документацией, и
# фиксацией продуктового решения внутри feature-PR. Правило по "**/*.md" уже приводило к двум
# меткам "type: *" на одном PR, что противоречит чек-листу в PULL_REQUEST_TEMPLATE.md, а
# sync-labels возвращал снятую метку на каждый пуш. Метка "type: docs" осталась в каталоге
# labels.yml и ставится руками на чисто документационных PR.

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/PULL_REQUEST_TEMPLATE.md"

"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.gradle"
          - "**/*.gradle.kts"
          - "gradle/**"
          - ".github/workflows/**"

"area: domain":
  - changed-files:
      - any-glob-to-any-file: "app/src/**/domain/**"

"area: storage":
  - changed-files:
      - any-glob-to-any-file: "app/src/**/data/local/**"

"area: network":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/**/data/remote/**"

"area: sync":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/**/data/sync/**"

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/**/feature/**"
          - "app/src/**/ui/**"

"area: platform":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/**/platform/**"
          - "app/src/main/AndroidManifest.xml"

"area: scanner":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/**/scanner/**"

"area: notifications":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/**/notifications/**"

"area: analytics":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/**/analytics/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
